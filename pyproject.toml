[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sil_test_quality"
version = "0.2.0"
description = "Common precommit checks for SIL Python repositories"
requires-python = ">=3.11"
dependencies = [
  "pytest>=9,<10", "coverage>=7.13.5,<8", "ruff==0.8.4",
  "mypy==2.4.0", "lizard==1.24.3",
  "click>=8.3.1,<9", "tomli-w==1.2.0",
]

[project.scripts]
sil-test-quality = "sil_test_quality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = ["--strict-markers", "--import-mode=importlib"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"

[tool.sil-test-quality]
version = "0.2.0"
version-file = "src/sil_test_quality/__init__.py"

# Lizard does not publish type stubs.
[[tool.mypy.overrides]]
module = "lizard"
ignore_missing_imports = true


[tool.setuptools.package-data]
sil_test_quality = ["baseline.toml"]
