[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sil_test_quality"
version = "0.1.0"
description = "Shared precommit checks for SIL Python repositories"
requires-python = ">=3.11"
dependencies = [
  "pytest>=9,<10", "coverage>=7.13.5,<8", "ruff>=0.8.4,<1",
  "mypy==2.4.0", "lizard==1.24.3",
]

[project.scripts]
sil-test-quality = "sil_test_quality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = ["--strict-markers", "--import-mode=importlib"]

[tool.ruff]
target-version = "py311"
line-length = 80

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
# PLC0415 is a preview rule in the pinned Ruff version.
preview = true
explicit-preview-rules = true
select = [
  "E4", "E501", "E7", "E9", "F", "I", "B", "SIM115",
  "N801", "N802", "N803", "N804", "N805", "N806", "N815", "N816",
  "TID251", "RUF006", "PLC0415",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
follow_imports = "silent"
python_version = "3.11"

[tool.sil-test-quality]
version = "0.1.0"
test-label = "Shared checker tests"
version-file = "src/sil_test_quality/__init__.py"

# Lizard does not publish type stubs.
[[tool.mypy.overrides]]
module = "lizard"
ignore_missing_imports = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"_pytest" = {msg = "Use pytest's public exports."}
"starlette.requests" = {msg = "Use fastapi.Request."}
"starlette.responses" = {msg = "Use fastapi.responses."}
"starlette.testclient" = {msg = "Use fastapi.testclient."}
"reflex.utils.prerequisites" = {msg = "Use the public Reflex CLI."}
